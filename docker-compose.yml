# Local development stack: backend + frontend + Firestore emulator.
# Usage: `make dev` (or `docker compose up --build`).
services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - firestore
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
