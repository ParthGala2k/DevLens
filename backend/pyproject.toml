[project]
name = "devlens-backend"
version = "0.1.0"
description = "DevLens — FastAPI + Gemini ADK agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    # Google Cloud / Gemini / ADK
    "google-adk>=0.1",
    "google-genai>=0.3",
    "google-cloud-bigquery>=3.25",
    "google-cloud-firestore>=2.18",
    # MCP client (Fivetran MCP server)
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
